# /etc/proxmox-mcp/config.toml
# Consumed by upstream ProxmoxMCP-Plus. Path is exported via PROXMOX_MCP_CONFIG.
# proxmox-mcp-vr does not parse this file directly; it reads the env vars
# below and lets the upstream load TOML from PROXMOX_MCP_CONFIG.

[proxmox]
host = "pve.lab.lan"
port = 8006
verify_ssl = true
service = "PVE"

[auth]
user = "mcp-agent@pve"
token_name = "mcpvr"
token_value = "REPLACE_ME_WITH_PVE_TOKEN_VALUE"

[logging]
level = "INFO"

[mcp]
host = "0.0.0.0"
port = 8080
transport = "SSE"

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # Install without the upstream git dep so CI doesn't depend on a
          # private/external repo; tests use FakeAPI fixtures and never import
          # proxmox_mcp.server.
          pip install -e . --no-deps
          pip install pytest pytest-asyncio respx pytest-httpx starlette uvicorn \
                      proxmoxer 'pydantic>=2' anyio requests httpx ruff
      - name: ruff
        run: ruff check src tests
      - name: pytest
        run: pytest -q

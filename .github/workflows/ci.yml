name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # Install the upstream from git so integration tests can exercise
          # the real ProxmoxMCPServer wiring (would have caught the
          # .api/.proxmox bug, JSON config bug, etc.).
          pip install -e .
          pip install pytest pytest-asyncio respx pytest-httpx httpx ruff
      - name: ruff
        run: ruff check src tests
      - name: pytest
        run: pytest -q
